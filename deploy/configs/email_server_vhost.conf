# Email Server — Apache 2.4 reverse proxy (Docker API :8089 + Admin UI :3006)
#
# Installed by setup.sh as:
#   /etc/apache2/sites-available/email_server_vhost.conf
#   sudo a2ensite email_server_vhost.conf
#
# Placeholders replaced by setup.sh:
#   __DOMAIN__  __API_UPSTREAM__  __UI_UPSTREAM__

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAdmin webmaster@__DOMAIN__

    # ACME HTTP-01 (Certbot)
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Laravel API
    ProxyPass        /api/ http://__API_UPSTREAM__/api/
    ProxyPassReverse /api/ http://__API_UPSTREAM__/api/

    # Branding / public storage
    ProxyPass        /storage/ http://__API_UPSTREAM__/storage/
    ProxyPassReverse /storage/ http://__API_UPSTREAM__/storage/

    # Swagger static assets
    ProxyPass        /docs-assets/ http://__API_UPSTREAM__/docs-assets/
    ProxyPassReverse /docs-assets/ http://__API_UPSTREAM__/docs-assets/

    # Health
    ProxyPass        /up http://__API_UPSTREAM__/up
    ProxyPassReverse /up http://__API_UPSTREAM__/up

    # Admin SPA (Vue)
    ProxyPass        / http://__UI_UPSTREAM__/
    ProxyPassReverse / http://__UI_UPSTREAM__/

    # Security headers (Certbot may add HSTS on the SSL vhost)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "1; mode=block"

    ErrorLog ${APACHE_LOG_DIR}/email-server-error.log
    CustomLog ${APACHE_LOG_DIR}/email-server-access.log combined
</VirtualHost>
